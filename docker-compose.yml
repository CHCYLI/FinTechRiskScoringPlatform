version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: risk_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/v1
    container_name: risk_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
